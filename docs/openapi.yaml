openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Kredensial tidak valid

  /api/v1/logout:
    post:
      summary: Logout dan mencabut token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout berhasil
        "401":
          description: Token tidak ada atau tidak valid

  /api/v1/products:
    get:
      summary: Ambil daftar produk dengan filter dan paginasi
      security:
        - bearerAuth: []
      description: Memerlukan token Sanctum dengan ability products:read.
      parameters:
        - name: page
          in: query
          description: Nomor halaman yang diminta.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Jumlah produk per halaman.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: category_id
          in: query
          description: Tampilkan produk dari kategori dengan ID ini.
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          description: Cari produk berdasarkan nama.
          schema:
            type: string
            minLength: 2
        - name: sort
          in: query
          description: Awalan minus mengurutkan secara menurun.
          schema:
            type: string
            enum: [name, -name, price, -price]
            default: name
      responses:
        "200":
          description: Halaman daftar produk
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        category_id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        stock:
                          type: integer
                        sku:
                          type: string
                          nullable: true
                        is_active:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        category:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
        "401":
          description: Token tidak ada atau tidak valid
        "403":
          description: Token tidak memiliki ability products:read
        "422":
          description: Parameter query tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
      responses:
        "201":
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer
        "401":
          description: Token tidak ada atau tidak valid
        "422":
          description: Input tidak valid

  /api/v1/transactions/{transaction}:
    get:
      summary: Ambil detail transaksi
      security:
        - bearerAuth: []
      parameters:
        - name: transaction
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detail transaksi berhasil diambil
        "401":
          description: Token tidak ada atau tidak valid
        "403":
          description: Tidak memiliki izin melihat transaksi
        "404":
          description: Transaksi tidak ditemukan

  /api/v1/categories:
    get:
      summary: Ambil daftar kategori
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "401":
          description: Token tidak ada atau tidak valid

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
